# Sentry private control plane.
#
# Nothing here publishes to a public interface. PostgreSQL and the Gateway bind
# loopback only; Hermes is not published at all and is reachable solely on the
# internal compose network. Public exposure is the ingress layer's job, and it
# terminates at the Gateway, never at the runtime.
#
# Secrets come from deploy/linux/.env, which is not in Git.

name: sentry

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sentry}
      # Deterministic collation so index behaviour is reproducible on restore.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      # Loopback only. Never 0.0.0.0.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentry} -d ${POSTGRES_DB:-sentry}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sentry]

  hermes:
    build:
      context: ./hermes
      args:
        # Defaults to the pinned release (see hermes/Dockerfile); .env overrides.
        HERMES_VERSION: ${HERMES_VERSION:-0.19.0}
        # Match the host owner of ./data so the bind mount is writable without root.
        HERMES_UID: ${HERMES_UID:-1000}
        HERMES_GID: ${HERMES_GID:-1000}
    restart: unless-stopped
    depends_on:
      server-control-mcp:
        condition: service_healthy
    environment:
      HERMES_HOME: /home/hermes/.hermes
      API_SERVER_ENABLED: "true"
      # Required by Hermes even on a loopback bind.
      API_SERVER_KEY: ${HERMES_API_KEY:?HERMES_API_KEY is required}
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      # Inference provider credentials. Without this passthrough the keys sit in
      # .env and never reach the process, and every turn fails with
      # "No inference provider configured" — the .env entry alone is not enough.
      #
      # All are optional so a provider switch is a config change, not a compose
      # edit. Which one is ACTIVE is decided by `model.provider` in
      # hermes/config.yaml, which outranks env autodetection in Hermes'
      # resolve_provider() chain. Do not rely on autodetection: a bare
      # OPENAI_API_KEY with no pinned provider resolves to "openrouter",
      # not native OpenAI.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      # One writable runtime data directory per profile. Never shared.
      - ./data/hermes/personal:/home/hermes/.hermes
      # The agent's work area. Sessions default their workspace to /workspace
      # (see HERMES_WEBUI_DEFAULT_WORKSPACE on the webui service), and the agent
      # executes here — so without a mount, anything it writes lives only in the
      # container's writable layer and is destroyed by the next `up -d` recreate.
      # This is a work area, NOT part of $HERMES_HOME, so sharing it with the
      # webui below does not cross the skills/config/memory boundary that keeps
      # ./data/hermes/personal unshared. Bound into the webui at the same path so
      # the session metadata is true in both environments.
      - ./data/workspace:/workspace
    # Deliberately no `ports:` block. Only the Gateway may reach the runtime.
    expose:
      - "8642"
    security_opt:
      - no-new-privileges:true
    networks: [sentry, server-control-tools]

  server-control-mcp:
    image: sentry-hermes
    build:
      context: ./hermes
      args:
        HERMES_VERSION: ${HERMES_VERSION:-0.19.0}
        HERMES_UID: ${HERMES_UID:-1000}
        HERMES_GID: ${HERMES_GID:-1000}
    restart: unless-stopped
    command: ["python3", "/opt/sentry-tools/server_control_mcp.py", "--http"]
    environment:
      SERVER_CONTROL_API_URL: http://host.docker.internal:7444/server-control/api/automation
      SERVER_CONTROL_TOKEN_FILE: /run/secrets/server-control-token
    volumes:
      - /opt/server-control/data/hermes-automation.token:/run/secrets/server-control-token:ro
    expose:
      - "8765"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [server-control-tools]

  gateway:
    build:
      context: ../../server/sentry_gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SENTRY_DATABASE_URL: postgresql://${POSTGRES_USER:-sentry}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentry}
      SENTRY_SIGNING_KEY: ${SENTRY_SIGNING_KEY:?SENTRY_SIGNING_KEY is required}
      SENTRY_RUNTIME_NAME: hermes
      SENTRY_HERMES_BASE_URL: http://hermes:8642
      SENTRY_HERMES_API_KEY: ${HERMES_API_KEY}
      # Must match the build arg above: the gateway compares this against the
      # version the running agent reports and flags drift. A default of
      # "unpinned" silently disables that check.
      SENTRY_HERMES_PINNED_VERSION: ${HERMES_VERSION:-0.19.0}
      SENTRY_HERMES_BOOTSTRAP_PROFILE_ID: ${SENTRY_BOOTSTRAP_PROFILE_ID:-}
      SENTRY_HERMES_BOOTSTRAP_PROFILE_NAME: ${SENTRY_BOOTSTRAP_PROFILE_NAME:-sentry-personal}
      # Fernet key that decrypts persisted per-profile Hermes bearer keys in the
      # runtime_endpoints table. Held only here (from .env), never in the DB.
      # Absent -> the gateway registers only the bootstrap profile (current
      # behaviour); present -> provisioned per-profile endpoints load at startup.
      SENTRY_RUNTIME_ENC_KEY: ${SENTRY_RUNTIME_ENC_KEY:-}
    ports:
      # Loopback only. Ingress terminates here, never at Hermes.
      - "127.0.0.1:8090:8090"
    security_opt:
      - no-new-privileges:true
    networks: [sentry]

  webui:
    # The Frontir fork of hermes-webui. Built from a checkout of the fork's
    # `frontir` branch rather than the upstream image, so the reskin and our
    # features ship from here without a later migration.
    build:
      context: /srv/sentry/webui
    restart: unless-stopped
    depends_on: [hermes]
    environment:
      # Gateway-backed chat: browser turns are routed to the Hermes API server
      # instead of importing Hermes in-process. This is what keeps the runtime
      # boundary intact — the WebUI never loads the agent, it speaks to it.
      # Product name. settings.bot_name defaults to
      # os.getenv("HERMES_WEBUI_BOT_NAME", "Hermes"), and that default is what
      # the sign-in page renders as its <title> and wordmark before any session
      # exists — which the desktop shell then mirrors into its title bar. Left
      # unset, the app window reads "Hermes — Sign in".
      HERMES_WEBUI_BOT_NAME: Sentry
      # The first-run wizard probes for an IN-PROCESS Hermes: it imports
      # run_agent and looks for $HERMES_HOME/config.yaml inside this container.
      # Neither exists here by design — this container never loads the agent, it
      # speaks to the hermes container over the network (see CHAT_BACKEND below).
      # So the wizard reports "agent_unavailable" on a deployment where chat
      # works fine, and blocks first load with a setup flow that would write a
      # local config nothing reads.
      #
      # This override is the documented escape hatch for pre-configured
      # deployments; onboarding.py honours it unconditionally and, once set,
      # refuses to overwrite operator config even if the wizard is reached
      # anyway by a stale bundle.
      HERMES_WEBUI_SKIP_ONBOARDING: "1"
      HERMES_WEBUI_CHAT_BACKEND: gateway
      # Multi-tenant cutover (2026-07-21). Browser turns go to the SENTRY
      # GATEWAY, not straight to one shared Hermes: the Gateway resolves the
      # caller's profile from their own token and routes to that profile's own
      # agent, failing closed. Pointing this back at http://hermes:8642 silently
      # reverts the whole deployment to one shared agent for everybody.
      HERMES_WEBUI_GATEWAY_BASE_URL: http://gateway:8090
      # Identity comes from a per-user Gateway enrollment token. With this set,
      # shared-password sign-in is refused (a password session carries no
      # profile), and the dialect itself counts as an auth method so auth is not
      # disabled by the absence of a password.
      HERMES_WEBUI_GATEWAY_DIALECT: sentry
      HERMES_WEBUI_GATEWAY_API_KEY: ${HERMES_API_KEY:?HERMES_API_KEY is required}
      # Approval cards. Without the runs API the agent can sit on an
      # approval-capable command with nothing surfaced in the UI to approve it —
      # which would quietly defeat the point of a governance boundary.
      HERMES_WEBUI_GATEWAY_USE_RUNS_API: "true"

      # Its OWN home, deliberately not Hermes'. Chat executes on Hermes via the
      # gateway, but the WebUI's session/skill/memory surfaces read whatever
      # HERMES_HOME it is given. Sharing Hermes' home would let the WebUI edit
      # skills inline, which is exactly what skills.write_approval and
      # guard_agent_created exist to prevent. Revisit deliberately, not by
      # accident.
      HERMES_HOME: /home/hermes/.hermes
      HERMES_WEBUI_STATE_DIR: /home/hermes/.hermes/webui

      # The default workspace every new session is stamped with. Pinned here so
      # it is declarative — a fresh deploy with an empty data dir resolves to
      # /workspace by config, not by falling through to ~/workspace. An explicit
      # env value also outranks whatever settings.json has stored (config.py
      # honours the env var over persisted config for exactly this Docker case),
      # so the value cannot drift. /workspace exists in this container (the image
      # creates it) and is bound to the same persisted host dir as the hermes
      # service, so what the UI reports and what the agent uses are one place.
      HERMES_WEBUI_DEFAULT_WORKSPACE: /workspace

      HERMES_WEBUI_HOST: 0.0.0.0
      HERMES_WEBUI_PORT: "8787"
      # Bound to the container interface, published to loopback only (below).
      # The password is the second lock, not the first.
      HERMES_WEBUI_PASSWORD: ${WEBUI_PASSWORD:?WEBUI_PASSWORD is required}

      # --- Published over HTTPS through the cloudflared sidecar -------------
      # TLS terminates at Cloudflare's edge, so this process only ever speaks
      # plain HTTP and cannot detect the secure context itself. Without this the
      # session cookie ships with NO Secure attribute on an internet-facing app.
      HERMES_WEBUI_SECURE: "1"
      HERMES_WEBUI_TRUST_FORWARDED_PROTO: "1"
      # Every request now arrives from the same socket peer (the sidecar), so
      # per-client rate limiting has to read the forwarded client. This is the
      # opt-in that makes the forwarded chain consultable AT ALL; it is honoured
      # only when the un-spoofable socket peer falls inside the CIDRs below, so
      # a direct client cannot promote itself with a header.
      HERMES_WEBUI_TRUST_FORWARDED_FOR: "1"
      # The compose network's subnet — Docker assigns it, and it is 172.25.0.0/16
      # on grain.silo today (`docker network inspect sentry_sentry`). It is NOT
      # pinned in the `networks:` block below on purpose: pinning IPAM forces a
      # network recreate, which means downing every Sentry container on a live
      # deployment. If Docker ever hands out a different subnet, this stops
      # matching and the trust check fails closed — per-client throttling
      # degrades back to one shared bucket (safe, but weaker), so re-check this
      # value after any `docker compose down`.
      HERMES_WEBUI_TRUSTED_PROXY_CIDRS: "172.25.0.0/16"
    volumes:
      - ./data/webui/home:/home/hermes/.hermes
      # Same persisted work area the hermes service mounts. The WebUI is
      # gateway-backed and does not execute the agent, so it does no file work
      # here itself — but sharing the mount means the workspace the UI names is
      # the workspace the agent actually writes to, not a divergent empty dir.
      - ./data/workspace:/workspace
    ports:
      # Loopback only, same rule as the Gateway — this host never opens a public
      # port. Kept for the SSH tunnel (the desktop shell and headless curl
      # checks on the box). Public reach comes from the cloudflared sidecar
      # below, which dials OUT to Cloudflare and reaches this container over the
      # compose network, not through this publish.
      - "127.0.0.1:8787:8787"
    security_opt:
      - no-new-privileges:true
    networks: [sentry]

  cloudflared:
    # Sentry's OWN tunnel — deliberately not the box's shared
    # /etc/cloudflared/config.yml, which serves the Frontir website. Its own
    # tunnel, credentials and ingress live here so this deployment owns its
    # front door end to end: nothing to edit in another project's repo, no root
    # on the host, and no listening port to firewall.
    #
    # This replaces the plan's `Caddy :443`. nginx owns 80/443 on grain.silo for
    # 25vid production; a third proxy could not have had 443 without displacing
    # it, and an outbound tunnel needs no inbound port at all.
    image: cloudflare/cloudflared:2026.7.2
    restart: unless-stopped
    depends_on: [webui]
    # The image defaults to its own `nonroot` uid (65532), which cannot read a
    # 0600 credentials file owned by the host operator — cloudflared then
    # crash-loops on "permission denied" forever. Run as the same host owner the
    # bind mounts use (same constraint the hermes service solves this way), so
    # the secret stays 0600 instead of being widened for the container.
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    # The tunnel ID is not a secret (the credentials file is), but it is
    # per-deployment, so it comes from .env rather than being baked in here.
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run ${SENTRY_TUNNEL_ID:?SENTRY_TUNNEL_ID is required}
    volumes:
      # Ingress rules are version-controlled. Config on the box is what
      # `git checkout -- .` silently reverted last time; keep it in the repo.
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      # Tunnel credentials — 0600, gitignored, never committed.
      - ./cloudflared/creds.json:/etc/cloudflared/creds.json:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [sentry]

networks:
  sentry:
    driver: bridge
  server-control-tools:
    driver: bridge

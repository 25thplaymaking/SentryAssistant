# Hermes profile configuration for the Sentry personal profile.
#
# Contains no secrets. Provider keys and the API server key arrive through the
# environment from deploy/linux/.env, which is not in Git.
#
# Isolation note: this Hermes runs as a non-root user inside its own container
# with no Docker socket. Its agent API is internal-only; only the raw Nous proxy
# is published on host loopback for Tardia. That container IS the whole-process
# boundary the security policy requires. `terminal.backend: docker` is
# deliberately NOT set here: enabling it would require mounting the host Docker
# socket into Hermes, which grants effective host root and would break the very
# boundary it is meant to provide.

model:
  # Pin Nous explicitly. OAuth lives in Hermes's auth store and is refreshed by
  # Hermes; environment-key autodetection is not part of this deployment.
  provider: nous
  # Stable, tool-capable, 1.3M-context model selected from the live Nous
  # catalogue on 2026-08-21. At the Plus-plan rate it is approximately
  # $0.06/M prompt and $0.14/M completion tokens. The dated slug prevents a
  # silent model change from altering production behavior.
  default: deepseek/deepseek-v4-flash-0731
  context_length: 131072

# One operational agent at a time. Tardia's raw proxy calls do not consume an
# agent slot, so ordinary Discord replies remain responsive while this blocks
# overlapping 50+ turn jobs from multiplying spend.
max_concurrent_sessions: 1

agent:
  max_turns: 16
  gateway_timeout: 300
  reasoning_effort: low

delegation:
  provider: nous
  model: deepseek/deepseek-v4-flash-0731
  max_iterations: 12
  max_concurrent_children: 1
  max_spawn_depth: 1
  orchestrator_enabled: true
  child_timeout_seconds: 300
  max_summary_chars: 12000

auxiliary:
  transient_retries: 1
  compression:
    provider: nous
    model: deepseek/deepseek-v4-flash-0731
    reasoning_effort: low
  background_review:
    provider: nous
    model: deepseek/deepseek-v4-flash-0731
    reasoning_effort: low
  vision:
    provider: nous
    model: google/gemini-3.7-flash
    reasoning_effort: low

# One image backend and one bill: Hermes routes this through the paid Nous Tool
# Gateway. FLUX Klein is the cheap, fast production default.
image_gen:
  provider: fal
  model: fal-ai/flux-2/klein/9b
  use_gateway: true

memory:
  # Durable memories are proposed, then shown to the profile's owner before they
  # are committed. Nothing is written silently.
  #
  # Kept ON deliberately, even though skills below are now ungated. These are
  # separate subsystems with different risk: memory is what shapes the
  # assistant's long-term behaviour, so a review queue earns its keep here in a
  # way it does not for skills.
  write_approval: true

skills:
  # Ungated as of 2026-07-20. The earlier comment here claimed agent-authored
  # skills "stay inactive until a human reviews the full diff" — that was wrong.
  # guard_agent_created runs a regex SCANNER (exfiltration / injection /
  # destructive / persistence / network / obfuscation), not a diff review.
  #
  # Off because the agent already has terminal, execute_code, write_file and
  # patch in its active toolset, so it can run the same code without passing a
  # skill through the scanner. Guarding the door beside an open window buys
  # friction, not security. Hermes ships both off by default for this reason.
  #
  # NOTE: externally-sourced skills are still scanned regardless — these flags
  # only affect agent-authored ones. Registry downloads keep the full
  # builtin/trusted/community trust policy, community blocked on any finding.
  #
  # Accepted residual risk: a terminal command runs once, a skill persists and
  # auto-loads into every later session. Lower risk than it sounds, not zero.
  write_approval: false
  guard_agent_created: false

tools:
  # Explicit toolset rather than "whatever is available", so a runtime upgrade
  # cannot silently widen what the agent can reach.
  lazy_install: false

  # MEASURED 2026-07-19 — do not re-attempt without new evidence.
  # Tool schemas are 83% of every request (47,623 of 57,543 bytes). Three
  # levers were tested against /v1/responses and ALL had zero effect on the
  # 11,565-token floor:
  #   1. `hermes tools disable computer_use browser`  (cli platform)
  #   2. `hermes tools disable cronjob image_gen delegation`
  #   3. `tools.tool_search.enabled: "on"`
  # Cause: `hermes tools disable` governs the cli/messaging platforms, and
  # tool_search defers only MCP/plugin tools — all 17 tools on the API-server
  # path are core Hermes tools, which are never deferred. The floor is not
  # reducible through supported configuration; it would require patching the
  # installed hermes_cli package.

api_server:
  enabled: true
  # Bound to the container interface so only the Sentry Gateway on the internal
  # compose network can reach it. It is never published to a host or public port.
  host: 0.0.0.0
  port: 8642

gateway:
  # Unknown senders are denied. No allow-all.
  allow_all_users: false

mcp_servers:
  server-control:
    url: http://server-control-mcp:8765/mcp

# ---------------------------------------------------------------------------
# Reachable models — the model picker's source of truth.
#
# Hermes' api_server advertises `hermes-agent` PLUS every alias below on
# GET /v1/models, and routes an incoming `model` field matching an alias to that
# alias' provider/model. The Sentry Gateway proxies that list to the WebUI and
# REFUSES any model not on it, so this table is the integration registry: a
# provider with no route cannot be selected, and adding a route publishes it
# everywhere at once. Never list a model this deployment cannot actually reach.
#
# NOTE: this file is a build-time SEED. Hermes reads $HERMES_HOME, i.e. the
# ./data/hermes/<slug>/ bind mount, so editing here changes only profiles
# provisioned AFTER the change. To alter a running profile, edit its live
# config and restart hermes. See docs/local-inference.md.
platforms:
  api_server:
    extra:
      model_routes:
        # Hosted through the paid Nous Portal subscription. The OAuth refresh
        # token is held in auth.json; no provider secret belongs in this file.
        deepseek-v4-flash:
          model: deepseek/deepseek-v4-flash-0731
          provider: nous
        # Local Qwen is deliberately not advertised. It remains a manual
        # emergency option and is never selected automatically.
